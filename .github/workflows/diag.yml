name: diag-posts
on:
  push:
    branches: [diag-posts]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag-posts }
      - run: |
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps webkit >/dev/null 2>&1
          node wk.js || echo falhou >> resultado.txt
          git config user.name diag; git config user.email diag@x; git add resultado.txt wk-*.png; git commit -m resultado; git push
