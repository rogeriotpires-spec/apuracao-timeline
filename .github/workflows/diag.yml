name: diag-posts
on:
  push:
    branches: [diag-posts]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag-posts }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: |
          npm i -g lighthouse@12 >/dev/null 2>&1
          U="https://site-timeline.marketing-b9d.workers.dev/"
          lighthouse "$U" --quiet --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh-mobile.json --only-categories=performance,best-practices,accessibility,seo || true
          lighthouse "$U" --quiet --preset=desktop --chrome-flags="--headless=new --no-sandbox" --output=json --output-path=lh-desktop.json --only-categories=performance,best-practices,accessibility,seo || true
          git config user.name diag; git config user.email diag@x; git add lh-*.json; git commit -m resultado; git push
