name: diag-posts
on:
  push:
    branches: [diag-posts]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag-posts }
      - run: |
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install --with-deps chromium >/dev/null 2>&1
          node crawl2.js https://editora-timeline.netlify.app/autor.html https://editora-timeline.netlify.app/biblioteca.html https://editora-timeline.netlify.app/cartilha.html https://editora-timeline.netlify.app/concurso.html https://editora-timeline.netlify.app/concursos.html https://editora-timeline.netlify.app/index.html https://editora-timeline.netlify.app/kit.html https://editora-timeline.netlify.app/lance.html https://editora-timeline.netlify.app/lances.html https://editora-timeline.netlify.app/ler.html https://editora-timeline.netlify.app/livro.html https://editora-timeline.netlify.app/pedido.html https://editora-timeline.netlify.app/privacidade.html https://editora-timeline.netlify.app/publicar.html https://editora-timeline.netlify.app/termos.html https://editora-timeline.netlify.app/mapa/ https://editora-timeline.netlify.app/mapa/olavo-de-carvalho/ https://editora-timeline.netlify.app/livro.html?l=almanaque-timeline https://editora-timeline.netlify.app/ler.html?l=almanaque-timeline\node crawl.js > crawl.json 2> crawl.err || trueamostra=1 https://timeline-eventos.netlify.app/assistir.html https://timeline-eventos.netlify.app/evento.html https://timeline-eventos.netlify.app/index.html https://timeline-eventos.netlify.app/ingresso.html https://timeline-eventos.netlify.app/organizador.html https://timeline-eventos.netlify.app/propor.html https://timeline-eventos.netlify.app/proposta.html https://timeline-eventos.netlify.app/senha.html https://timeline-eventos.netlify.app/evento.html?e=timeline-encontro-com-allan-dos-santos https://lp.revistatimeline.com/ https://loja.revistatimeline.com/ > crawl2.json 2> crawl.err || true
          git config user.name diag; git config user.email diag@x; git add crawl2.json crawl.err; git commit -m resultado; git push
