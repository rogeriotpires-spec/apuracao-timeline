name: diag-posts
on:
  push:
    branches: [diag-posts]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag-posts }
      - run: |
          for f in mobile desktop; do curl -sS -m 170 "https://www.googleapis.com/pagespeedonline/v5/runPagespeed?url=https%3A%2F%2Frevistatimeline.com%2F&strategy=$f&category=performance&category=best-practices&category=accessibility&locale=pt_BR" -o psi-$f.json; ls -la psi-$f.json; done
          git config user.name diag; git config user.email diag@x; git add psi-*.json; git commit -m resultado; git push
