name: diag-posts
on:
  push:
    branches: [diag-posts]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag-posts }
      - run: |
          {
          for q in "offset=0" "offset=0&search=moraes"; do echo "== $q"; curl -sS -w "\n%{http_code}\n" "https://site-timeline.marketing-b9d.workers.dev/api/posts?$q&nc=$RANDOM" | python3 -c "import sys,json;t=sys.stdin.read().rstrip();b,c=t.rsplit('\n',1);print(c);d=json.loads(b);print(d.get('more'),d.get('next'),[p['title'] for p in d['posts']][:3])"; done
          } > resultado.txt 2>&1
          git config user.name diag; git config user.email diag@x; git add resultado.txt; git commit -m resultado; git push
