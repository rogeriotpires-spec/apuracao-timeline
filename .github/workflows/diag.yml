name: diag-posts
on:
  push:
    branches: [diag-posts]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag-posts }
      - run: |
          B=https://site-timeline.marketing-b9d.workers.dev
          for p in / /fonts/inter-v4.woff2 /img/t.png /img/c/fc29d2f1accb56-300.webp /api/programas /p/teste-antigo; do echo "== $p"; curl -sS -o /dev/null -D - "$B$p" | grep -i "^\(HTTP\|cache-control\|location\|cf-cache-status\)"; done > resultado.txt 2>&1
          git config user.name diag; git config user.email diag@x; git add resultado.txt; git commit -m resultado; git push
