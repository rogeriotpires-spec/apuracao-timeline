name: diag-posts
on:
  push:
    branches: [diag-posts]
permissions:
  contents: write
jobs:
  d:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: diag-posts }
      - run: |
          npm i playwright@1 >/dev/null 2>&1 && npx playwright install chromium >/dev/null 2>&1
          node cls.js > resultado.txt 2>&1 || true
          git config user.name diag; git config user.email diag@x; git add resultado.txt; git commit -m resultado; git push
