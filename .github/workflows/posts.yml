name: artigos-do-substack
on:
  schedule: [{ cron: "*/15 * * * *" }]
  workflow_dispatch:
  push:
    paths: [scripts/atualiza_posts.py, .github/workflows/posts.yml, menu/timeline-menu.js]
permissions:
  contents: write
concurrency: { group: posts, cancel-in-progress: false }
jobs:
  atualiza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pillow
      - run: python3 scripts/atualiza_posts.py 2> err.txt || { echo "::error::$(tail -c 600 err.txt | tr "\n" " ")"; exit 1; }
      - run: |
          git config user.name "Robô Timeline"; git config user.email "rogeriotpires@gmail.com"
          git add -A novo-site/data novo-site/img/c novo-site/index.html novo-site/js
          git diff --cached --quiet || (git commit -m "Site: artigos e destaques atualizados" && git pull --rebase -q && git push)
